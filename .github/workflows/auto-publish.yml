name: CI
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  main:
    name: Build, Validate and Deploy
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: devincabillo-web/spec-prod@clean-w3c-tests
        with:
          GH_PAGES_BRANCH: gh-pages
          BUILD_FAIL_ON: warning
